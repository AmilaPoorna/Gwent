# Builds the signed Android app and publishes it as the latest release (gwent.apk)
name: Android APK

on:
  push:
    branches: [master]
    paths: ['www/**', 'android/**', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npx cap sync android
      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.GWENT_KEYSTORE_BASE64 }}
          GWENT_KEYSTORE_PASSWORD: ${{ secrets.GWENT_KEYSTORE_PASSWORD }}
          GWENT_KEY_PASSWORD: ${{ secrets.GWENT_KEYSTORE_PASSWORD }}
          GWENT_KEY_ALIAS: gwent
          GWENT_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gwent.p12"
          export GWENT_KEYSTORE="$RUNNER_TEMP/gwent.p12"
          cd android
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/gwent.apk"
      - name: Publish the APK as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "$RUNNER_TEMP/gwent.apk" \
            --title "Gwent 1.0.${{ github.run_number }}" --latest \
            --notes "Android app: download gwent.apk on your phone and open it. Step-by-step help: https://github.com/${{ github.repository }}/blob/master/HOW_TO_INSTALL_AND_PLAY.md"
